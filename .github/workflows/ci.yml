name: TruthLens AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests-and-benchmarks:
    name: Backend Tests, Regression & Benchmarks
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'gsk_ci_mock_test_key_000000000000' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio python-dotenv httpx

      - name: Run Full Pytest Suite (Unit, Search, Forensics, Multimodal)
        run: |
          python -m pytest tests/ -v

      - name: Run Forensics Validation
        run: |
          python -m pytest tests/test_forensics_validation.py -v

      - name: Run 100-Case Labeled Benchmark
        run: |
          python tests/run_labeled_benchmark.py

      - name: Run Performance Benchmark (Queue & Latency)
        run: |
          python tests/benchmark_performance.py

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --include=dev

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        run: npx next build --webpack
